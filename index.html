<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creov Canvas — Graphic Designer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#000;--mut:#6b6b6b;--line:#d6d6d6;--acc:var(--ink);--card:#efefef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mut:#8c8c8c;--line:#2a2a2a;--card:#151515}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mut:#8c8c8c;--line:#2a2a2a;--card:#151515}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);scroll-behavior:smooth;scroll-snap-type:y proximity}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font:400 12px/1.4 'Poppins',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.serif{font-family:'Poppins',system-ui,sans-serif;font-weight:500;letter-spacing:-.01em}
a{color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;background:var(--bg);border-bottom:1px solid var(--line)}
nav .brand{font:400 26px 'Poppins',system-ui,sans-serif;text-decoration:none}
nav .brand .logo{height:38px;width:auto;display:block;color:var(--ink)}
nav ul{display:flex;gap:clamp(14px,3vw,38px);list-style:none;padding:0}
nav ul a{text-decoration:none;font:400 12px 'Poppins',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding-bottom:4px;border-bottom:1px solid transparent;transition:.25s}
nav ul a:hover,nav ul a.on{color:var(--ink);border-color:var(--acc)}
main{padding:0 5vw;max-width:1280px;margin:0 auto;animation:in .7s cubic-bezier(.2,.7,.2,1)}
main.zin{animation:zin .8s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes zin{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:minmax(260px,5fr) 7fr;gap:clamp(32px,7vw,110px);padding:clamp(40px,8vw,100px) 0;align-items:start}
.photo{position:relative;aspect-ratio:3/4;border-radius:999px 999px 6px 6px;background:var(--card)}
.photo::after{content:"";position:absolute;inset:16px -16px -16px 16px;border:1px solid var(--ink);border-radius:999px 999px 6px 6px;z-index:-1}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;filter:grayscale(1)}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;font:italic 84px 'Poppins',system-ui,sans-serif;color:var(--mut)}
.badge{position:absolute;right:-34px;bottom:46px;width:112px;height:112px;background:var(--bg);border-radius:50%;animation:spin 22s linear infinite}
.badge text{font:400 10.5px 'Poppins',system-ui,sans-serif;letter-spacing:.2em;fill:var(--ink);text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(38px,6vw,84px);line-height:.95;letter-spacing:-.02em;margin:14px 0 36px}
h1 em{font-style:italic;font-weight:400}
.about p{font-size:clamp(17px,1.5vw,20px);max-width:52ch}
.skills{margin-top:14px;border-top:1px solid var(--ink);padding:0}
.skills li{list-style:none;display:flex;gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);font-size:clamp(22px,2.6vw,32px);transition:.3s}
.skills li:hover{padding-left:14px;color:var(--acc)}
.foot{border-top:1px solid var(--ink);padding:70px 0 90px;margin-top:40px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px;margin-top:34px}
.links a{display:block;text-decoration:none;border-top:1px solid var(--line);padding-top:14px;transition:.3s}
.links a:hover{border-color:var(--acc)}
.links b{display:block;font:400 clamp(20px,2vw,26px) 'Poppins',system-ui,sans-serif;margin-top:6px;word-break:break-word}
.pg{padding:clamp(40px,7vw,90px) 0 100px}
.pg h2{font-size:clamp(44px,7vw,100px);line-height:1;letter-spacing:-.03em;margin:22px 0 48px}
.wide{margin:0 -5vw}
.mq{overflow:hidden;margin-bottom:24px}
.mq-in{display:flex;width:max-content;animation:mq var(--mq,70s) linear infinite}
.mq-in.rev{animation-direction:reverse}
.mq:hover .mq-in{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.vm{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;height:78vh;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent)}
.vc{overflow:hidden}
.vc-in{display:flex;flex-direction:column;animation:vu var(--mq,70s) linear infinite}
.vc:nth-child(2) .vc-in{animation-duration:calc(var(--mq,70s)*1.3);animation-delay:calc(var(--mq,70s)*-.35)}
.vc:nth-child(3) .vc-in{animation-duration:calc(var(--mq,70s)*1.6);animation-delay:calc(var(--mq,70s)*-.7)}
.vc:hover .vc-in{animation-play-state:paused}
@keyframes vu{to{transform:translateY(-50%)}}
.ct{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ct a{text-decoration:none;font:400 11px/1 'Poppins',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:9px 15px;transition:.25s}
.ct a:hover{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.mq-t{flex:none;width:100%;aspect-ratio:4/5;margin-bottom:24px;background:var(--card);overflow:hidden;cursor:pointer}
.mq-t img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}
.mq-t:hover img{transform:scale(1.06)}
.mq-t.sel{outline:1px solid var(--acc);outline-offset:4px}
.mq-t.ph{cursor:default}
#zm{display:grid;place-items:center;text-align:center;min-height:0}
#zm.on{min-height:62vh;border-top:1px solid var(--line);margin-top:30px}
#zm .zoom{all:unset;cursor:pointer;font:italic 500 clamp(70px,15vw,200px)/1 'Poppins',system-ui,sans-serif;letter-spacing:-.03em;transition:.4s;animation:in .6s}
#zm .zoom:hover{color:var(--acc);letter-spacing:.01em}
.cl{margin-top:30px}
.cl a{display:flex;gap:28px;align-items:baseline;text-decoration:none;border-top:1px solid var(--line);padding:24px 0;font-size:clamp(28px,4.4vw,56px);line-height:1.1;transition:.35s}
.cl a:last-child{border-bottom:1px solid var(--line)}
.cl a:hover{padding-left:22px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:72px 48px}
.grid .it{aspect-ratio:4/5;background:var(--card);overflow:hidden;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}
.grid .it:hover img{transform:scale(1.05)}
.nx{display:flex;justify-content:space-between;gap:20px;margin-top:100px;padding-top:28px;border-top:1px solid var(--ink)}
.nx a{text-decoration:none;font-size:clamp(24px,3.4vw,44px);transition:.3s}.nx a:hover{color:var(--acc)}
.pj{padding:36px 0 90px;text-align:center}
.pj img{max-width:100%;max-height:78vh;display:block;margin:30px auto 0}
.pj .bar{display:flex;justify-content:space-between}
.pj .bar a{text-decoration:none}
.big a{display:flex;justify-content:space-between;align-items:baseline;gap:20px;text-decoration:none;border-top:1px solid var(--line);padding:28px 0;font-size:clamp(28px,5vw,64px);line-height:1.1;transition:.3s;word-break:break-word}
.big a:last-child{border-bottom:1px solid var(--line)}
.big a:hover{padding-left:20px;color:var(--acc)}
.panel{border-top:1px solid var(--ink);padding:32px 0 48px;display:grid;gap:14px;max-width:640px}
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);padding:11px 13px;width:100%;border-radius:0}
textarea{min-height:130px}
button.b{font:400 12px 'Poppins',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);border:0;padding:14px 22px;cursor:pointer;justify-self:start}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.row button{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit}
.ft{display:flex;justify-content:space-between;max-width:1280px;margin:0 auto;padding:26px 5vw 40px;border-top:1px solid var(--line)}
.ft a{text-decoration:none;opacity:.7;transition:.3s}.ft a:hover{opacity:1;color:var(--acc)}
@media(prefers-reduced-motion:reduce){.vc-in,.badge{animation:none}html{scroll-behavior:auto}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.photo{max-width:340px}.badge{right:-10px}nav ul{gap:12px}nav .brand .logo{height:30px}}
@media(max-width:760px){.vm{grid-template-columns:repeat(2,1fr);gap:14px}.vc:nth-child(3){display:none}}
#cv{position:fixed;inset:0;background:var(--ink);z-index:50;transform:translateY(100%);pointer-events:none}
.cta{margin-top:44px;font:500 14px 'Poppins',system-ui,sans-serif;letter-spacing:.04em;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:999px;padding:18px 34px;cursor:pointer;display:inline-flex;gap:14px;align-items:center;transition:.35s}
.cta:hover{background:transparent;color:var(--ink);gap:24px}
.sq{height:100vh;display:grid;place-items:center}
.sq-in{display:grid;gap:18px;justify-items:center;cursor:zoom-in;opacity:0;transform:translateY(60px) scale(.94);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.sq-in.on{opacity:1;transform:none}
.sq-in img{max-height:72vh;max-width:min(88vw,640px);width:auto;display:block}
.ctc{padding:120px 0 40px;border-top:1px solid var(--ink)}
.ctc h2{margin:18px 0 20px!important;font-size:clamp(34px,5vw,64px)!important}
@keyframes bob{50%{transform:translateY(8px)}}
.cue{margin-top:48px;animation:bob 2s ease-in-out infinite}
.snap{scroll-snap-align:start}
.rise{opacity:0;transform:translateY(90px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rise.in{opacity:1;transform:none}
main.nf{animation:none}
body.fpm{overflow:hidden;height:100vh}
#fp{position:fixed;left:0;right:0;top:var(--nh,82px);bottom:0;overflow:hidden}
#fpi{height:100%;transition:transform .95s cubic-bezier(.77,0,.18,1)}
#fp .snap{height:100%;position:relative;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;padding:0 5vw}
#fp .snap::-webkit-scrollbar{display:none}
#fp .sl{width:100%;max-width:1280px;margin:auto;opacity:0;transform:translateY(60px);transition:opacity .8s ease .35s,transform .9s cubic-bezier(.2,.7,.2,1) .35s}
#fp .snap.act .sl{opacity:1;transform:none}
#fp .hero{padding:24px 0;gap:clamp(28px,6vw,90px)}
#fp .photo{height:min(60vh,540px);width:auto;aspect-ratio:3/4;max-width:100%}
#fp .pg{padding:24px 0 40px}
#fp .pg h2{margin:14px 0 28px}
#fp .vm{height:46vh}
#fp #zm.on{min-height:56vh}
#fp .grid{gap:32px}
#fp .nx{margin-top:56px}
#fp .big a{padding:18px 0;font-size:clamp(24px,4vw,48px)}
#dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:14px;z-index:6}
body.fpm #dots{display:flex}
#dots button{all:unset;box-sizing:border-box;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);cursor:pointer;transition:.3s}
#dots button.on{background:var(--ink);transform:scale(1.5)}
@media(max-width:760px){#fp .photo{height:36vh}#fp .vm{height:40vh}}
body.fpm>.ft{display:none}
#fpi{position:relative;transition:none}
#fp .snap{position:absolute;inset:0;height:auto;opacity:0;visibility:hidden;transform:scale(.7);z-index:1;transition:opacity .9s ease,transform 1.2s cubic-bezier(.7,0,.2,1),visibility 0s linear .9s}
#fp .snap.past{transform:scale(1.7)}
#fp .snap.act{opacity:1;visibility:visible;transform:none;z-index:2;transition:opacity .9s ease .15s,transform 1.2s cubic-bezier(.7,0,.2,1),visibility 0s}
#fpi.na .snap{transition:none!important}
#fp .sl{opacity:1;transform:none;transition:none}
#fp .snap[data-id="works"]{padding:0;overflow:hidden}
#fp [data-id="works"] .sl{max-width:none;width:100%;height:100%;margin:0}
#fp [data-id="works"] .pg{padding:0;height:100%;position:relative}
#fp [data-id="works"] .vm{position:absolute;inset:0;height:100%;padding:0 5vw;margin:0}
#fp [data-id="works"] .ct{position:absolute;top:16px;left:5vw;right:5vw;z-index:3;margin:0}
#fp [data-id="works"] .ct a{background:var(--bg)}
#fp [data-id="works"] #zm{display:none}
#fp [data-id="works"] #zm.on{display:grid;position:absolute;inset:0;z-index:4;min-height:0;margin:0;border:0;cursor:zoom-out;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px)}
</style>
</head>

const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const hp=async(pw,salt)=>{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))};
const mk=async pw=>{const salt=hx(crypto.getRandomValues(new Uint8Array(16)));return{salt,h:await hp(pw,salt)}};

const b64=t=>btoa(unescape(encodeURIComponent(t)));
const ghReq=async(path,o={})=>{const r=await fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+path+(o.q||''),{method:o.method||'GET',headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});if(!r.ok)throw new Error('GitHub '+r.status);return r.json()};
const ghPut=async(path,c64,m)=>{let sha;try{sha=(await ghReq(path,{q:'?ref='+GH.branch})).sha}catch(e){}return ghReq(path,{method:'PUT',body:{message:m,content:c64,branch:GH.branch,...(sha?{sha}:{})}})};
const ghDel=async path=>{const f=await ghReq(path,{q:'?ref='+GH.branch});return ghReq(path,{method:'DELETE',body:{message:'Delete '+path,sha:f.sha,branch:GH.branch}})};
const rebuild=()=>{P=CFG.projects.map((p,i)=>({id:'s'+i,cat:S.cats.indexOf(p.category),img:p.image,t:i})).filter(p=>p.cat>=0)};

CFG.projects.forEach(p=>{const i=prev.indexOf(p.category);if(i>=0&&S.cats[i]&&S.cats[i]!==prev[i])p.category=S.cats[i]});
CFG.site={name:S.name,about:S.about,skills:S.skills,photo:S.photo,theme:S.theme,speed:S.speed,categories:S.cats.slice(0,MAXC),contact:Object.keys(S.c||{}).length?S.c:oc};
await ghPut('projects.json',b64(JSON.stringify(CFG,null,2)),'Update portfolio content');rebuild()};

const sas={upload:async f=>{const n=Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'-');const u=new Uint8Array(await f.arrayBuffer());let bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));await ghPut('images/'+n,btoa(bin),'Add image '+n);return{id:'images/'+n,url:'images/'+n}},delete:async()=>{}};
const kd=async(pw,salt)=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
const j64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));const u64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const enc=async(pw,o)=>{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return JSON.stringify({s:j64(salt),i:j64(iv),c:j64(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kd(pw,salt),new TextEncoder().encode(JSON.stringify(o))))})};
const dec=async(pw,t)=>{const o=JSON.parse(t);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u64(o.i)},await kd(pw,u64(o.s)),u64(o.c))))};
const guessRepo=()=>{const h=location.hostname;if(!/\.github\.io$/.test(h))return'';const u=h.replace('.github.io','');const g=location.pathname.split('/').filter(Boolean)[0];return u+'/'+(g&&!/\.html?$/.test(g)?g:u+'.github.io')};
const staticGate=()=>{const has=!!ls('cc_gh');const m=msg?`<p class="mono" style="color:var(--acc);margin-bottom:16px">${esc(msg)}</p>`:'';
return has?`${m}<div class="panel"><span class="mono">Enter admin password</span><input type="password" id="pw"><button class="b" id="go">Unlock</button><button class="b" id="rs" style="background:none;color:var(--ink);border:1px solid var(--ink)">Reset on this device</button></div>`
:`${m}<div class="panel"><span class="mono">One-time setup on this device</span><a class="mono" style="color:var(--ink)" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a token on GitHub ↗</a><label class="mono">GitHub repository (username/name)</label><input id="gr" placeholder="username/portfolio" value="${esc(guessRepo())}"><label class="mono">Branch</label><input id="gb" value="main"><label class="mono">GitHub token (Contents: read and write)</label><input type="password" id="gt"><label class="mono">Create admin password (8+ characters)</label><input type="password" id="pw"><button class="b" id="go">Save &amp; enter</button></div>`};
let view='',idx=0,lock=false;
const ids=()=>['home','works',...S.cats.slice(0,MAXC).map((_,i)=>'cat-'+i),'contact'];
const site=()=>{const b=[home(),works(),...S.cats.slice(0,MAXC).map((_,i)=>catPg(i)),contactPg()];
return `<div id="fp"><div id="fpi">${ids().map((id,i)=>`<div class="snap" data-id="${id}"><div class="sl">${b[i]}</div></div>`).join('')}</div></div><div id="dots">${ids().map((id,i)=>`<button data-i="${i}" aria-label="${id}"></button>`).join('')}</div>`};
const curS=()=>document.querySelectorAll('#fpi>.snap')[idx];
const canFlip=d=>{const e=curS();if(!e)return true;const m=e.scrollHeight-e.clientHeight;return !(m>3&&(d>0?e.scrollTop<m-3:e.scrollTop>3))};
function mark(){document.querySelectorAll('#fpi>.snap').forEach((e,i)=>{e.classList.toggle('act',i===idx);e.classList.toggle('past',i<idx);if(i!==idx)e.scrollTop=0});
document.querySelectorAll('#dots button').forEach((b,i)=>b.classList.toggle('on',i===idx));
const id=ids()[idx],key=id==='home'?'home':id==='contact'?'contact':'works';
document.querySelectorAll('nav [data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===key));
try{history.replaceState(null,'','#'+id)}catch(e){}}
function fpSet(instant){const f=$('#fpi');if(!f)return;if(instant)f.classList.add('na');mark();if(instant){f.offsetHeight;f.classList.remove('na')}}
function go(i){const n=ids().length;i=Math.max(0,Math.min(n-1,i));if(i===idx||lock)return;lock=true;idx=i;fpSet();setTimeout(()=>{lock=false},950)}
function render(){applyS();const r=(location.hash||'#home').slice(1);let m,k,pg,v;
if(r==='admin'){v='admin';k='admin';pg=admin()}
else if(m=r.match(/^p-(\d+)$/)){v='p';k='works';pg=projPg(+m[1])}
else{v='site';k='home';pg=site()}
const keep=v==='site'&&view==='site';
document.querySelectorAll('nav [data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===k));
$('#app').innerHTML=`<main class="${v==='site'?'nf':zoomNext?'zin':''}">${pg}</main>`;zoomNext=false;view=v;
document.body.classList.toggle('fpm',v==='site');
document.documentElement.style.setProperty('--nh',($('nav').offsetHeight||82)+'px');
if(v==='site'){if(keep)idx=Math.min(idx,ids().length-1);else{const i=ids().indexOf(r);idx=i<0?0:i}fpSet(true)}
bind(k,v)}

const rise=h=>{const cv=$('#cv');if(!cv||matchMedia('(prefers-reduced-motion:reduce)').matches){location.hash=h;return}
const o={duration:650,easing:'cubic-bezier(.76,0,.24,1)',fill:'forwards'};
cv.animate([{transform:'translateY(100%)'},{transform:'translateY(0)'}],o).onfinish=()=>{location.hash=h;requestAnimationFrame(()=>cv.animate([{transform:'translateY(0)'},{transform:'translateY(-100%)'}],{...o,duration:750}))}};
function bind(k,v){
if(v==='site')document.querySelectorAll('#dots button').forEach(b=>b.onclick=()=>{lock=false;go(+b.dataset.i)});
document.querySelectorAll('[data-g]').forEach(f=>f.onclick=()=>{zoomNext=true;location.hash='p-'+f.dataset.g});
document.querySelectorAll('.mq-t[data-k]').forEach(t=>t.onclick=()=>{sel=t.dataset.k;
document.querySelectorAll('.mq-t.sel').forEach(x=>x.classList.remove('sel'));document.querySelectorAll(`.mq-t[data-k="${sel}"]`).forEach(x=>x.classList.add('sel'));
const z=$('#zm');z.classList.add('on');z.innerHTML='<button class="zoom">ZOOM</button>';z.querySelector('button').onclick=()=>{zoomNext=true;location.hash='p-'+sel};
z.onclick=e=>{if(e.target===z){z.classList.remove('on');z.innerHTML=''}}});
if(k!=='admin'||!owner||!db)return;
const save=()=>db.doc('site/main').set(S);
if(STATIC&&!unlocked){const go=async()=>{const pw=$('#pw').value;try{
if(!ls('cc_gh')){const repo=$('#gr').value.trim(),br=$('#gb').value.trim()||'main',tk=$('#gt').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tk||pw.length<8){msg='Fill in every field (password 8+ characters)';return render()}
GH={repo,branch:br,token:tk};await ghReq('projects.json',{q:'?ref='+br});ls('cc_gh',await enc(pw,GH));unlocked=true;msg=''}
else{GH=await dec(pw,ls('cc_gh'));unlocked=true;msg=''}}catch(e){GH=null;msg=ls('cc_gh')?'Incorrect password':'Could not reach that repository with this token'}render()};
$('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};const rs=$('#rs');if(rs)rs.onclick=()=>{ls('cc_gh',null);msg='Reset';render()};return}
if(!unlocked){const go=async()=>{const pw=$('#pw').value;try{
if(auth===null){if(pw.length<8){msg='Use at least 8 characters';return render()}const a=await mk(pw);await db.doc('auth/main').set(a);auth=a;unlocked=true;msg=''}
else if((await hp(pw,auth.salt))===auth.h){unlocked=true;msg=''}else msg='Incorrect password'}catch(e){msg='Could not verify'}render()};
$('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};return}
$('#lk').onclick=()=>{unlocked=false;msg='';render()};
$('#cp').onclick=async()=>{const pw=$('#np').value;if(pw.length<8){msg='Use at least 8 characters';return render()}try{if(STATIC)ls('cc_gh',await enc(pw,GH));else{auth=await mk(pw);await db.doc('auth/main').set(auth)}msg='Password updated'}catch(e){msg='Could not update'}render()};
$('#sp').onclick=async()=>{try{const f=$('#ph').files[0];if(f){S.photo=(await assets.upload(f)).url}S.about=$('#ab').value.trim()||S.about;S.name=$('#nm').value.trim()||S.name;S.skills=$('#sk').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,6);await save();msg='Profile saved'}catch(e){msg='Could not save: '+(e.message||e.code)}render()};
$('#sct').onclick=async()=>{const c={mail:$('#cm').value.trim(),be:$('#cb').value.trim(),ig:$('#ci2').value.trim(),li:$('#cl').value.trim(),ph:$('#cp2').value.trim()};
if(![c.be,c.ig,c.li].every(u=>/^https:\/\//.test(u))){msg='Social links must start with https://';return render()}
try{S.c=c;sync();await save();msg='Contact saved'}catch(e){msg='Could not save'}render()};
$('#sap').onclick=async()=>{try{S.speed=+$('#sd').value;S.theme=$('#th').value;await save();msg='Appearance saved'}catch(e){msg='Could not save'}render()};
$('#sc').onclick=async()=>{try{S.cats=[...document.querySelectorAll('.ci')].map((i,n)=>i.value.trim()||S.cats[n]);await save();msg='Categories saved'}catch(e){msg='Could not save'}render()};
$('#ap').onclick=async()=>{const c=+$('#pc').value,f=$('#pf').files[0];
if(!f){msg='Choose an image';return render()}
if(P.filter(p=>p.cat===c).length>=MAXP){msg='This category already has '+MAXP+' projects. Delete one first.';return render()}
try{const a=await assets.upload(f);await db.collection('projects').add({cat:c,img:a.url,aid:a.id,t:Date.now()});cur=c;msg='Project added'}catch(e){msg='Upload failed: '+(e.message||e.code)}render()};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this project?'))return;const p=P.find(x=>x.id===b.dataset.d);try{await db.doc('projects/'+b.dataset.d).delete();if(p&&p.aid&&assets)await assets.delete(p.aid)}catch(e){}})}

addEventListener('hashchange',()=>{msg='';const r=location.hash.slice(1);
if(view==='site'&&(r===''||ids().includes(r))){lock=false;go(Math.max(0,ids().indexOf(r)));return}
scrollTo({top:0,behavior:'instant'});render()});
addEventListener('click',e=>{if(view!=='site')return;const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;const r=a.getAttribute('href').slice(1);if(ids().includes(r)){e.preventDefault();lock=false;go(ids().indexOf(r))}});
addEventListener('wheel',e=>{if(view!=='site')return;const d=e.deltaY;if(Math.abs(d)<6)return;if(!canFlip(d))return;e.preventDefault();go(idx+(d>0?1:-1))},{passive:false});
let ty=0,st=0;
addEventListener('touchstart',e=>{ty=e.touches[0].clientY;const c=curS();st=c?c.scrollTop:0},{passive:true});
addEventListener('touchend',e=>{if(view!=='site')return;const dy=ty-e.changedTouches[0].clientY;if(Math.abs(dy)<60)return;const c=curS();if(c&&Math.abs(c.scrollTop-st)>3)return;if(!canFlip(dy))return;go(idx+(dy>0?1:-1))},{passive:true});
addEventListener('keydown',e=>{if(view!=='site'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key,dn=['ArrowDown','PageDown',' '].includes(k),up=['ArrowUp','PageUp'].includes(k);if(!dn&&!up)return;e.preventDefault();const d=dn?1:-1;if(!canFlip(d)){curS().scrollBy({top:d*140,behavior:'smooth'});return}go(idx+d)});
addEventListener('resize',()=>{document.documentElement.style.setProperty('--nh',($('nav').offsetHeight||82)+'px')});
render();
(async()=>{try{if(!window.claude){const r=await fetch('projects.json',{cache:'no-store'});CFG=await r.json();CFG.site=CFG.site||{};CFG.projects=CFG.projects||[];const x=CFG.site;
if(x.name)S.name=x.name;if(x.about)S.about=x.about;if(Array.isArray(x.skills))S.skills=x.skills.slice(0,6);if(x.photo)S.photo=x.photo;if(x.contact)S.c=x.contact;if(Array.isArray(x.categories))S.cats=x.categories.slice(0,MAXC);if(x.theme)S.theme=x.theme;if(x.speed)S.speed=+x.speed;
STATIC=true;owner=true;db=sdb;assets=sas;auth={};rebuild();sync();render();return}
db=await claude.use('db');assets=await claude.use('assets');const u=await claude.use('user');owner=u?await u.isOwner():false;
if(db){db.doc('site/main').onSnapshot(s=>{if(s.exists){const d=s.data();S={...S,...d,cats:(d.cats||S.cats).slice(0,MAXC),skills:(d.skills||S.skills).slice(0,6)};sync()}render()},()=>{});
db.collection('projects').orderBy('t').onSnapshot(q=>{P=q.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
if(owner){try{const a=await db.doc('auth/main').get();auth=a.exists?a.data():null}catch(e){}}}
render()}catch(e){}})();
</script>
</body>
</html>
